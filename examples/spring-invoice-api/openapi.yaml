openapi: 3.0.3
info:
  title: Generated invoice approval API
  version: 1.0.0
paths:
  /api/invoices/{id}/approval-details:
    get:
      operationId: getInvoiceForApproval
      summary: Read an invoice for approval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The invoice under review
