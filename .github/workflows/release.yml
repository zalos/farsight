# Opens a release PR on demand. `main` is protected (PRs only, CI required, no
# bypass), so this workflow never pushes to it: it runs the gates, commits the
# version bump + CHANGELOG.md + .github/release-notes/vX.Y.Z.md on a new branch
# release/vX.Y.Z, smoke-tests the tarball, pushes the branch and opens the PR
# `chore(release): vX.Y.Z`. Squash-merging that PR (the only merge kind main
# allows; the PR title becomes the commit) runs publish.yml, which tags that
# commit, packs and creates the GitHub Release.
# Run it from the Actions tab or `gh workflow run release.yml -f bump=minor`.
# docs/RELEASING.md explains each input, the RELEASE_TOKEN secret and the rehearsal.
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump (ignored when version is set)
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Explicit version X.Y.Z (optional; overrides bump)
        type: string
        required: false
      prerelease:
        description: Prerelease tag such as beta.1 (optional; makes X.Y.Z-beta.1)
        type: string
        required: false
      dry_run:
        description: Run the gates and print the version and notes; push nothing, open no PR
        type: boolean
        default: false

# contents: write pushes the release/vX.Y.Z branch (never main);
# pull-requests: write opens the PR and labels it.
permissions:
  contents: write
  pull-requests: write

# one release at a time: two runs bumping from the same version would collide on the branch
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # inputs reach the scripts through env, never pasted into shell text
      BUMP: ${{ inputs.bump }}
      VERSION: ${{ inputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}
      DRY_RUN: ${{ inputs.dry_run }}
      # a PR opened with GITHUB_TOKEN does not start pull_request workflows (GitHub's
      # recursion guard), so CI would not run on it; a RELEASE_TOKEN PAT avoids that
      HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
    steps:
      - name: Refuse a real release from a branch other than main
        if: ${{ github.ref != 'refs/heads/main' && !inputs.dry_run }}
        env:
          REF: ${{ github.ref_name }}
        run: |
          echo "::error::a release is cut from main, not $REF (a dry run may use any branch)"
          exit 1

      - name: Check out with full history and tags
        uses: actions/checkout@v7
        with:
          # the changelog reads <last tag>..HEAD, and the build stamp reads git
          fetch-depth: 0
          lfs: true
          # the token the branch is pushed with: RELEASE_TOKEN when set, else GITHUB_TOKEN
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@v6

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck (packages + e2e)
        run: pnpm typecheck

      # live tracker tests are opt-in (FARSIGHT_LIVE=1) and skip here
      - name: Test (packages + scripts)
        run: pnpm test

      - name: Lint strings
        run: pnpm lint:strings

      - name: Commit the version on release/vX.Y.Z (no tag)
        id: release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          args=()
          if [ -n "$VERSION" ]; then args+=(--version "$VERSION"); else args+=(--bump "$BUMP"); fi
          if [ -n "$PRERELEASE" ]; then args+=(--prerelease "$PRERELEASE"); fi
          # a dry run may be dispatched from any branch; a real release only from main
          if [ "$DRY_RUN" = "true" ]; then args+=(--allow-branch); fi
          node scripts/release.mjs "${args[@]}" --no-tag --branch 'release/v{version}' --commit-notes \
            --notes-out "$RUNNER_TEMP/release-notes.md"

      - name: Refuse a release branch or tag that already exists on the remote
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null; then
            echo "::error::$BRANCH already exists on origin — merge or close its PR and delete the branch first"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG is already released"; exit 1
          fi

      # after the version commit, so the bundle's stamp names it; publish.yml packs again after the merge
      - name: Pack
        run: node scripts/pack.mjs

      - name: Smoke-test the tarball
        env:
          V: ${{ steps.release.outputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          prefix="$RUNNER_TEMP/npm-prefix"
          npm install -g --prefix "$prefix" "./build/farsight-cli-$V.tgz"
          line="$("$prefix/bin/farsight" --version)"
          echo "$line"
          case "$line" in *"farsight $V "*) ;; *) echo "::error::--version does not print $V"; exit 1 ;; esac
          case "$line" in *"commit $COMMIT"*) ;; *) echo "::error::--version does not print commit $COMMIT"; exit 1 ;; esac
          # ingest from a temporary cwd: snapshots are written relative to it
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          "$prefix/bin/farsight" ingest "$GITHUB_WORKSPACE/examples/invoice-app" --repo invoice-app --out "$RUNNER_TEMP/smoke/g.json"
          test -s "$RUNNER_TEMP/smoke/g.json"

      - name: Write the PR body
        env:
          TAG: ${{ steps.release.outputs.tag }}
          BRANCH: ${{ steps.release.outputs.branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            cat "$RUNNER_TEMP/release-notes.md"
            echo
            echo '---'
            echo
            echo "**Release PR.** Squash-merge it keeping this title (\`gh pr merge --squash\`); \`publish.yml\` then tags \`$TAG\` on the squash commit, packs, smoke-tests and creates the GitHub Release."
            echo
            echo "**Gates already run** on this exact commit by the [release workflow]($RUN_URL): install, build, typecheck, test, lint:strings, pack and the tarball smoke test."
            if [ "$HAS_RELEASE_TOKEN" != "true" ]; then
              echo
              echo "**CI has not started on this PR**: it was opened with \`GITHUB_TOKEN\`, which does not trigger \`pull_request\` workflows, and \`main\` requires the \`validate\` and \`e2e\` checks. To start them, close and reopen this PR, or push an empty commit to \`$BRANCH\` (\`git commit --allow-empty -m 'ci: run checks'\`). A \`RELEASE_TOKEN\` secret removes this step (docs/RELEASING.md)."
            fi
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Release notes and plan (job summary)
        env:
          TAG: ${{ steps.release.outputs.tag }}
          BRANCH: ${{ steps.release.outputs.branch }}
          BASE: ${{ github.ref_name }}
        run: |
          {
            if [ "$DRY_RUN" = "true" ]; then
              echo "## farsight-cli $TAG — dry run (no branch pushed, no PR opened)"
            else
              echo "## farsight-cli $TAG — release PR $BRANCH → $BASE"
            fi
            echo
            cat "$RUNNER_TEMP/release-notes.md"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/pr-body.md"

      - name: Push the release branch
        if: ${{ !inputs.dry_run }}
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
        run: git push -u origin "$BRANCH"

      - name: Open the release PR
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          BRANCH: ${{ steps.release.outputs.branch }}
          BASE: ${{ github.ref_name }}
        run: |
          # the label is a convenience: a token that cannot create labels does not stop the release
          gh label create release --color 5BC8DD --description 'A release PR opened by the release workflow' 2>/dev/null \
            || echo "label 'release' exists or cannot be created"
          if ! url="$(gh pr create --base "$BASE" --head "$BRANCH" --title "chore(release): $TAG" --body-file "$RUNNER_TEMP/pr-body.md")"; then
            {
              echo
              echo "### The PR could not be opened"
              echo
              echo "\`$BRANCH\` is pushed. Allow *Settings → Actions → General → Allow GitHub Actions to create and approve pull requests*, or add a \`RELEASE_TOKEN\` secret (docs/RELEASING.md), or open it by hand — a PR you open yourself starts CI:"
              echo
              echo '```sh'
              echo "git fetch origin $BRANCH"
              echo "git show origin/$BRANCH:.github/release-notes/$TAG.md > /tmp/notes.md"
              echo "gh pr create --base $BASE --head $BRANCH --title \"chore(release): $TAG\" --label release --body-file /tmp/notes.md"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::could not open the release PR; $BRANCH is pushed — the job summary has the command to open it by hand"
            exit 1
          fi
          gh pr edit "$url" --add-label release || echo "::warning::could not label $url"
          echo "release PR: $url"
          { echo; echo "Release PR: $url"; } >> "$GITHUB_STEP_SUMMARY"
