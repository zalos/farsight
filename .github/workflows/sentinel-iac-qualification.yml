# Qualification of the infrastructure and CI adapters on a native Linux/amd64 runner (PR 13, ADRs 33 and 34). It runs on
# a pull request only when those adapters, their fixtures, the execution service they use or this workflow changes, and
# by hand:
#   gh workflow run sentinel-iac-qualification.yml --ref <branch>   (once the workflow is on the default branch)
# It is not a required check. Provisioning is the only network step, an explicit setup step: it installs each pinned
# image index, checks that it lists the linux/amd64 manifest the adapter records, and acquires the pinned Trivy checks
# bundle through the owner acquisition script (digest-pinned, so it can only ever yield those bytes). The scans never
# pull (`--pull never` in PR 07) and run with no network on the original synthetic fixtures. Every test must run: a
# skipped, failed or cancelled test fails the job, and so does a container left behind or a daemon that cannot be asked.
# A green run is evidence for moving linux/amd64 from unmeasured to measured; it changes nothing itself.
name: sentinel-iac-qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/sentinel-iac-qualification.yml
      - packages/sentinel/src/adapters/trivy/**
      - packages/sentinel/src/adapters/zizmor/**
      - packages/sentinel/src/adapters/sealed-input.ts
      - packages/sentinel/src/execution/**
      - packages/sentinel/test/trivy-*.ts
      - packages/sentinel/test/zizmor-*.ts
      - packages/sentinel/test/iac-helpers.ts
      - packages/sentinel/test/fixtures/iac/**
      - packages/sentinel/scripts/package-assets-trivy.mjs
      - packages/sentinel/scripts/package-assets-zizmor.mjs
      - packages/sentinel/scripts/acquire-trivy-checks.mjs
      - scripts/pack-sentinel.mjs
      - scripts/test-sentinel-package.mjs

permissions:
  contents: read

concurrency:
  group: sentinel-iac-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  iac-linux-amd64:
    name: iac-linux-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TRIVY_INDEX: ghcr.io/aquasecurity/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
      TRIVY_AMD64: sha256:2e6c00d711ab4ae41d8a30c2c1fd3bd3b62704c177bb120f95012e939edfb3df
      ZIZMOR_INDEX: ghcr.io/zizmorcore/zizmor@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9
      ZIZMOR_AMD64: sha256:cfc533b8fa781c51c6fb4085057945bc3eebb6b6e8a25ab7daa85c885f071269
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Native amd64 host
        run: |
          test "$(uname -m)" = x86_64 || { echo "::error::not a native amd64 host"; exit 1; }
          docker version --format '{{.Server.Version}} {{.Server.Os}}/{{.Server.Arch}}'
      - name: Provision the pinned images (provenance; network)
        run: |
          set -euo pipefail
          check() {
            docker manifest inspect "$1" > index.json
            # shellcheck disable=SC2016 # the JavaScript is single-quoted on purpose
            EXPECT="$2" node -e '
              const i = JSON.parse(require("fs").readFileSync("index.json", "utf8"));
              const m = (i.manifests ?? []).find(x => x.platform?.os === "linux" && x.platform?.architecture === "amd64");
              if (!m || m.digest !== process.env.EXPECT) { console.error("::error::the index does not list the expected linux/amd64 manifest"); process.exit(1); }
              console.log(`linux/amd64 manifest ${m.digest} (${m.size} bytes)`);'
            docker pull --platform linux/amd64 "$1"
            test "$(docker image inspect "$1" --format '{{.Architecture}}')" = amd64
          }
          check "$TRIVY_INDEX" "$TRIVY_AMD64"
          check "$ZIZMOR_INDEX" "$ZIZMOR_AMD64"
      - run: pnpm install --frozen-lockfile
      - name: Build Sentinel and its workspace closure
        run: pnpm --filter '@farsight/sentinel...' build
      - name: Acquire the pinned Trivy checks bundle (owner setup step; network)
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/iac-owner"
          node packages/sentinel/scripts/acquire-trivy-checks.mjs --dir "$RUNNER_TEMP/iac-owner"
      - name: Adapter unit and real-engine conformance on linux/amd64, nothing skipped
        working-directory: packages/sentinel
        env:
          SENTINEL_ISOLATION: '1'
          SENTINEL_IAC_QUALIFY: linux/amd64
        run: |
          set -o pipefail
          export SENTINEL_TRIVY_CHECKS_DIR="$RUNNER_TEMP/iac-owner"
          node --disable-warning=ExperimentalWarning --experimental-strip-types --test --test-timeout=600000 \
            --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=iac.tap \
            test/trivy-adapter.test.ts test/trivy-conformance.test.ts test/zizmor-adapter.test.ts test/zizmor-conformance.test.ts
          grep -qx '# skipped 0' iac.tap || { echo "::error::an IaC adapter test was skipped"; exit 1; }
          grep -qx '# fail 0' iac.tap && grep -qx '# cancelled 0' iac.tap
      - name: Install the packed tarball and run its shipped workers
        env:
          SENTINEL_ISOLATION: '1'
          SENTINEL_IAC_QUALIFY: linux/amd64
        run: |
          set -o pipefail
          export SENTINEL_TRIVY_CHECKS_DIR="$RUNNER_TEMP/iac-owner"
          pnpm pack:sentinel
          node scripts/test-sentinel-package.mjs | tee package.log
          grep -q 'installed trivy worker run by the workspace service: .* (amd64 measured' package.log
          grep -q 'installed zizmor worker run by the workspace service: .* (amd64 measured' package.log
      - name: No container left behind
        if: always()
        run: |
          set -euo pipefail
          # A failing daemon query must fail this step: the listing is its own command, then tested.
          containers=$(docker ps -aq --filter label=org.farsight.sentinel.store)
          if [ -n "$containers" ]; then echo "::error::Sentinel containers left behind: $containers"; exit 1; fi
