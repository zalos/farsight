# CI validation: every push to main and every pull request.
# A small path selector skips checks unaffected by the change, and validate tests only the packages the change
# reaches (see docs/CI.md).
# validate / e2e retain their required names; secrets always runs.
# PR title and branch commit checks live in commits.yml so title edits don't restart CI.
# Live tracker tests stay off: they run only with FARSIGHT_LIVE=1, which CI never sets.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: affected checks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      validate: ${{ steps.select.outputs.validate }}
      e2e: ${{ steps.select.outputs.e2e }}
      echo: ${{ steps.select.outputs.echo }}
      sentinel: ${{ steps.select.outputs.sentinel }}
      isolation: ${{ steps.select.outputs.isolation }}
      recovery: ${{ steps.select.outputs.recovery }}
      service: ${{ steps.select.outputs.service }}
      npmBuild: ${{ steps.select.outputs.npmBuild }}
      # validate's unit tests: `packages` with the names to test, `none` (only the skills trees changed), or
      # anything else, a missing scope or a missing list under `packages` included, for every package
      testScope: ${{ steps.select.outputs.testScope }}
      testPackages: ${{ steps.select.outputs.testPackages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # PR merge-base / all commits in a push; no LFS assets needed
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Check the selector
        run: node --test scripts/test/ci-changes.test.mjs
      - name: Select affected checks
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-changes.mjs

  # Optional: npm-only checkout build and both installable tarballs.
  npm-build:
    name: npm-build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.npmBuild != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Use npm 10 with pnpm absent from PATH
        shell: bash
        run: |
          npm install --global npm@10
          bin="$RUNNER_TEMP/npm-only-bin"
          mkdir -p "$bin"
          ln -s "$(command -v node)" "$bin/node"
          ln -s "$(command -v npm)" "$bin/npm"
          export PATH="$bin:/usr/bin:/bin"
          if command -v pnpm; then echo 'pnpm must be absent from this job' >&2; exit 1; fi
          node --version
          npm --version
          echo "PATH=$PATH" >> "$GITHUB_ENV"
      - run: npm install
      - run: npm run build
      - run: node scripts/pack.mjs
      - run: npm run pack:sentinel
      - name: Install both tarballs and print their versions
        shell: bash
        run: |
          prefix="$(mktemp -d)"
          trap 'rm -rf "$prefix"' EXIT
          npm install --prefix "$prefix" "$PWD"/build/farsight-cli-*.tgz "$PWD"/build/sentinel/farsight-sentinel-*.tgz
          "$prefix/node_modules/.bin/farsight" --version
          "$prefix/node_modules/.bin/farsight-sentinel" --version

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # the action lists a PR's commits; it posts no comments (below)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks reads the commits, not only the tree

      # a personal-account repo needs no GITLEAKS_LICENSE (gitleaks-action README);
      # v3 is the Node 24 release, v2 stopped running when Node 20 left the runners
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: 8.30.1 # the config's [[allowlists]] syntax; bump deliberately
          GITLEAKS_ENABLE_COMMENTS: false

  # Required. Runs whenever any runtime check is selected (code, config or dependency changes);
  # a documentation-only change skips it explicitly, which satisfies the required check.
  lint:
    name: lint
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.validate != 'false' || needs.changes.outputs.e2e != 'false' || needs.changes.outputs.echo != 'false' || needs.changes.outputs.sentinel != 'false' || needs.changes.outputs.isolation != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the style-PR check reads the merge base; no LFS assets needed
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formatting (Prettier)
        run: pnpm format:check
      - name: Lint (ESLint errors; existing ones are frozen in eslint-suppressions.json)
        run: pnpm lint
      - name: A style pull request changes no program (AST-identical to its merge base)
        if: ${{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'style') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ast-equivalence.mjs "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" "$HEAD_SHA"

  validate:
    name: validate
    needs: changes
    # A failed selector runs the check. Only an explicit false skips it.
    if: ${{ !cancelled() && needs.changes.outputs.validate != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # `tsc -p` type-checks every package as it emits, with the config `pnpm -r typecheck` uses, so there is no
      # separate typecheck step; e2e types are checked by the e2e job
      - run: pnpm build
      - name: Verify the generated graph contract
        run: node scripts/graph-schema.mjs --check
      - name: Verify the embedded config schema
        run: node scripts/config-schema.mjs --check
      # The changed packages, their dependents and the packages whose tests read them, as the selector worked them
      # out: one `pnpm --filter <name>` each, every name checked against the workspace first. A missing scope or a
      # missing or empty list under `packages` tests every package.
      # Sentinel's unit suite only: its process suite (packages/sentinel/test/process-suite.txt) runs in
      # sentinel-service, which the selector starts whenever validate tests Sentinel. The unit suite runs the files
      # packages/sentinel/test/no-skip-suite.txt lists first and fails if any of their tests was skipped.
      - name: Test the packages the change reaches
        env:
          TEST_SCOPE: ${{ needs.changes.outputs.testScope }}
          TEST_PACKAGES: ${{ needs.changes.outputs.testPackages }}
          SENTINEL_TEST_SUITE: unit
          SENTINEL_TEST_LAUNCHES: '1' # a unit file that starts a Node.js process unlisted fails (sentinel-tests.mjs)
        run: node scripts/ci-changes.mjs --run-tests
      - run: pnpm test:scripts
      - run: pnpm lint:strings

  # Required when selected; unrelated changes explicitly skip this integration check.
  echo-package:
    name: echo-package
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.echo != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install and verify the separate Echo package with synthetic memory
        run: pnpm test:echo:package

  # Sentinel is a separate optional package (ADR 18). Farsight's tarball is packed with only the
  # CLI's build closure, so Sentinel is unbuilt, and must install and start from a clean npm
  # consumer; the same again in a temporary copy of the workspace with packages/sentinel removed;
  # then Sentinel's own tarball installs, type-checks and validates on its own.
  # Each packer stages its build and replaces only its own outputs in build/.
  sentinel-package:
    name: sentinel-package
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.sentinel != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pack, install and start farsight-cli with Sentinel unbuilt
        run: |
          pnpm pack:cli
          test ! -e packages/sentinel/dist || { echo "::error::Sentinel was built by the CLI's closure build"; exit 1; }
          node scripts/test-farsight-package.mjs
      - name: Pack, install and start farsight-cli with no Sentinel package in the workspace
        run: pnpm test:cli:package:absent
      # Sentinel's eight clean npm-only consumers (scripts/test-sentinel-consumers.mjs), three at a time on private
      # copies of the tarball, and beside them the release acceptance of both tarballs: each package alone and both,
      # global and project-local, from URLs, with only node, npm and npx. A development check that publishes nothing:
      # gates for Sentinel features not built yet are reported as pending (--allow-pending); any failed gate fails.
      - name: Pack Sentinel; its clean npm consumers and the npm-only acceptance of both tarballs
        run: |
          test -f packages/sentinel/package.json || { echo "::error::packages/sentinel/package.json is missing"; exit 1; }
          pnpm pack:sentinel
          node scripts/test-sentinel-consumers.mjs --jobs 3 --acceptance -- --allow-pending --report "$RUNNER_TEMP/acceptance.json"

  # Sentinel's real-container isolation canaries (PR 07). The pinned canary image is installed here, by digest,
  # before the tests; the code under test never pulls and refuses a missing image. SENTINEL_ISOLATION=1 makes a
  # missing or unqualified container runtime a failure, and the job fails if any test was skipped.
  sentinel-isolation:
    name: sentinel-isolation
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.isolation != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the pinned canary image (node:22-alpine index, by digest)
        run: docker pull node@sha256:ebc216c22db53dbde85719a874978d5aec04e6e405ad26a3804c6f9abc4ca1a9
      - name: Install the pinned Gitleaks image (v8.30.1 official index, by digest)
        run: docker pull ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
      - name: Build Sentinel and its workspace closure
        run: pnpm --filter '@farsight/sentinel...' build
      - name: Check bounded observation forwarding and journal classifications
        working-directory: packages/sentinel
        run: |
          set -o pipefail
          node --disable-warning=ExperimentalWarning --experimental-strip-types --test --test-timeout=30000 \
            --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=isolation-diagnostic-controls.tap \
            test/isolation-diagnostic-controls.test.ts
          grep -qx '# skipped 0' isolation-diagnostic-controls.tap
          grep -qx '# fail 0' isolation-diagnostic-controls.tap
          grep -qx '# cancelled 0' isolation-diagnostic-controls.tap
      - name: Record native runner provenance and preflight actual journal argv
        working-directory: packages/sentinel
        env:
          SENTINEL_DIAGNOSTIC_OUT: ${{ runner.temp }}/sentinel-isolation-observation
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { diagnosticProvenance } from './test/helpers/isolation-diagnostic.ts';
          const out = process.env.SENTINEL_DIAGNOSTIC_OUT;
          mkdirSync(out, { recursive: true, mode: 0o700 });
          try {
            const identity = { commit: process.env.GITHUB_SHA, ...await diagnosticProvenance() };
            writeFileSync(join(out, 'runner-provenance.json'), JSON.stringify(identity, null, 2), { flag: 'wx', mode: 0o600 });
          } catch (error) {
            writeFileSync(join(out, 'runner-preflight-failure.json'), JSON.stringify({ commit: process.env.GITHUB_SHA, reason: 'preflightUnavailable', journal: error.journal ?? null }, null, 2), { flag: 'wx', mode: 0o600 });
            throw error;
          }
          NODE
      - name: Isolation canaries and the worker protocol, nothing skipped
        working-directory: packages/sentinel
        env:
          SENTINEL_ISOLATION: '1'
          SENTINEL_ISOLATION_DIAGNOSTIC: '1'
          SENTINEL_DIAGNOSTIC_OUT: ${{ runner.temp }}/sentinel-isolation-observation
        run: |
          set -o pipefail
          node --disable-warning=ExperimentalWarning --experimental-strip-types --test --test-timeout=300000 \
            --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=isolation.tap \
            test/execution-isolation.test.ts test/execution-protocol.test.ts test/execution-container-faults.test.ts test/execution-framing-budget.test.ts test/execution-container-recovery.test.ts test/secrets-conformance.test.ts test/gitleaks-cli.test.ts
          grep -qx '# skipped 0' isolation.tap || { echo "::error::an isolation test was skipped"; exit 1; }
          grep -qx '# fail 0' isolation.tap && grep -qx '# cancelled 0' isolation.tap
      - name: The installed public CLI runs the secret scan (npm-only consumer, the existing pinned image)
        env:
          SENTINEL_ISOLATION: '1'
        run: |
          set -o pipefail
          pnpm pack:sentinel
          node scripts/test-sentinel-secrets-consumer.mjs

      - name: Preserve bounded isolation observations and test outcomes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sentinel-isolation-observation-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/sentinel-isolation-observation/
            packages/sentinel/isolation.tap
            packages/sentinel/isolation-diagnostic-controls.tap

  # Sentinel's crash recovery smoke (PR 08): one real SIGKILL at each coordinator boundary, then a fresh process
  # recovers and finishes the run. SENTINEL_RECOVERY_SMOKE=1 fails on a missing prerequisite, and the job fails if
  # any test was skipped. The 20-repetition matrix is the dedicated sentinel-recovery-full workflow.
  sentinel-recovery:
    name: sentinel-recovery
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.recovery != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Sentinel and its workspace closure
        run: pnpm --filter '@farsight/sentinel...' build
      - name: Kill at every boundary once, recover, nothing skipped
        working-directory: packages/sentinel
        env:
          SENTINEL_RECOVERY_SMOKE: '1'
        run: |
          set -o pipefail
          node --disable-warning=ExperimentalWarning --experimental-strip-types --test --test-timeout=600000 \
            --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=recovery.tap \
            test/execution-recovery-kill.test.ts test/execution-coordinator.test.ts
          grep -qx '# skipped 0' recovery.tap || { echo "::error::a recovery test was skipped"; exit 1; }
          grep -qx '# fail 0' recovery.tap && grep -qx '# cancelled 0' recovery.tap

  # Sentinel's command line, local socket and background service (PR 09) on Linux: native amd64, the runner's
  # non-root user, Node from .nvmrc. The owner-only socket and private-state checks only mean something as a
  # non-root user, and the detached service, its kill-and-resume test and the rule lock need a qualified store, so
  # the job fails if it runs as root or if any test was skipped. It runs Sentinel's process suite, the files listed in
  # packages/sentinel/test/process-suite.txt, which validate leaves out; so it runs whenever validate tests Sentinel.
  sentinel-service:
    name: sentinel-service
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.service != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Sentinel and its workspace closure
        run: pnpm --filter '@farsight/sentinel...' build
      - name: Sentinel's process suite (socket, CLI, detached service, rule lock) as a non-root user, nothing skipped
        working-directory: packages/sentinel
        run: |
          set -o pipefail
          test "$(id -u)" != 0 || { echo "::error::the service tests must run as a non-root user"; exit 1; }
          test "$(uname -m)" = x86_64 || { echo "::error::the service tests must run on native amd64"; exit 1; }
          umask 022
          # the serial files first, one at a time, then the rest; the summary sums every run
          node ../../scripts/sentinel-tests.mjs --suite process --launches --summary service-summary.txt -- --test-timeout=300000
          grep -qx '# skipped 0' service-summary.txt || { echo "::error::a service test was skipped"; exit 1; }
          grep -qx '# fail 0' service-summary.txt && grep -qx '# cancelled 0' service-summary.txt

  e2e:
    name: e2e
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.e2e != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 11
    env:
      # the suite's own ports, stated so a reader sees them (these are the defaults)
      FARSIGHT_E2E_PORT: '4510'
      FARSIGHT_E2E_SYNC_PORT: '4511'
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - run: pnpm e2e:typecheck

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Install chromium and its system libraries
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install chromium's system libraries (browser restored from cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # The four Sentinel browser steps run when sentinel-package does (the CLI's closure, which the owner UI journey
      # serves, and Sentinel's) or when validate tests Sentinel (a Sentinel test change); otherwise they are skipped.
      - name: Sentinel paired owner browser journey (no skips)
        if: ${{ needs.changes.outputs.sentinel != 'false' || needs.changes.outputs.service != 'false' }}
        env:
          SENTINEL_OWNER_UI_BROWSER: '1'
        run: |
          set -o pipefail
          node --disable-warning=ExperimentalWarning --experimental-strip-types --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination=sentinel-owner-ui.tap \
            packages/sentinel/test/owner-ui-browser.test.ts
          grep -q '^# tests 1$' sentinel-owner-ui.tap
          grep -q '^# pass 1$' sentinel-owner-ui.tap
          grep -q '^# fail 0$' sentinel-owner-ui.tap
          grep -q '^# cancelled 0$' sentinel-owner-ui.tap
          grep -q '^# skipped 0$' sentinel-owner-ui.tap

      - name: Installed Sentinel owner browser workflow
        if: ${{ needs.changes.outputs.sentinel != 'false' || needs.changes.outputs.service != 'false' }}
        run: |
          node scripts/pack.mjs
          node scripts/pack-sentinel.mjs
          node scripts/test-sentinel-owner-ui-consumer.mjs

      - name: Sentinel offline HTML delivery and print (no skips)
        if: ${{ needs.changes.outputs.sentinel != 'false' || needs.changes.outputs.service != 'false' }}
        env:
          SENTINEL_REPORT_BROWSER: '1'
        run: |
          set -o pipefail
          node --disable-warning=ExperimentalWarning --experimental-strip-types --test \
            --test-name-pattern='the HTML report opens offline with JavaScript disabled' \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination=sentinel-report-browser.tap \
            packages/sentinel/test/reports.test.ts
          grep -q '^# tests 1$' sentinel-report-browser.tap
          grep -q '^# pass 1$' sentinel-report-browser.tap
          grep -q '^# fail 0$' sentinel-report-browser.tap
          grep -q '^# cancelled 0$' sentinel-report-browser.tap
          grep -q '^# skipped 0$' sentinel-report-browser.tap

      - name: Sentinel retained structural HTML delivery and print (no skips)
        if: ${{ needs.changes.outputs.sentinel != 'false' || needs.changes.outputs.service != 'false' }}
        env:
          SENTINEL_REPORT_BROWSER: '1'
        run: |
          set -euo pipefail
          node --disable-warning=ExperimentalWarning --experimental-strip-types --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination=sentinel-paths-browser.tap \
            packages/sentinel/test/path-report-browser.test.ts
          grep -qx '# tests 1' sentinel-paths-browser.tap
          grep -qx '# pass 1' sentinel-paths-browser.tap
          grep -qx '# fail 0' sentinel-paths-browser.tap
          grep -qx '# cancelled 0' sentinel-paths-browser.tap
          grep -qx '# skipped 0' sentinel-paths-browser.tap

      - run: pnpm e2e

      # the perf suite on the small synthetic workspace (≈50 projects · ≈20k nodes): every surface must draw with no
      # page error; budgets apply only to the full preset, run locally with `pnpm e2e:perf` (docs/CI.md)
      - name: pnpm e2e:perf (small preset)
        run: pnpm e2e:perf
        env:
          FARSIGHT_PERF_PRESET: small

      - name: Upload the perf table
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-perf-results
          path: e2e/perf/results.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload results.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-json
          path: e2e/test-results/results.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload report, traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            e2e/test-results/
            e2e/.playwright-report/
            sentinel-paths-browser.tap
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
